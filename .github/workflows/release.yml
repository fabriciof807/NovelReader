name: Build Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode keystore
        if: ${{ env.KEYSTORE_FILE_BASE64 != '' }}
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "$KEYSTORE_FILE_BASE64" | base64 -d > "$RUNNER_TEMP/android-keys.jks"
          ls -la "$RUNNER_TEMP/android-keys.jks"

      - name: Create key.properties
        if: ${{ env.KEYSTORE_FILE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > key.properties <<EOF
          storeFile=$RUNNER_TEMP/android-keys.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          ls -la app/build/outputs/apk/release/
          echo "apk_path=$(ls app/build/outputs/apk/release/*.apk | head -1)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate --no-column | grep -E '^v' | sed -n '2p' || true)
          if [ -z "$PREV_TAG" ]; then
            git log --oneline --no-merges > /tmp/release-notes.md
          else
            git log "${PREV_TAG}..HEAD" --oneline --no-merges > /tmp/release-notes.md
          fi
          echo "--- Preview ---"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: ${{ steps.apk.outputs.apk_path }}
          fail_on_unmatched_files: true
