name: Build Release APK

# Manual runs build the APK; tag pushes follow this repo's convention, which is
# either `v2.9.3` or a bare `2.9.3` (the releases published so far use the bare
# form).
#
# Signing needs four repository secrets: KEYSTORE_FILE_BASE64 (base64 of the
# .jks), KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. Without them the run
# still builds an *unsigned* APK as a CI smoke test (it catches R8/ProGuard
# breakage) but never creates a release, so an unsigned APK can never be
# published as an update. The step summary says which path was taken.

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Decided in its own step: a step cannot read an env var it defines itself.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not configured: this run builds an unsigned APK and will not create a release."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "$KEYSTORE_FILE_BASE64" | base64 -d > "$RUNNER_TEMP/android-key.jks"
          ls -la "$RUNNER_TEMP/android-key.jks"

      - name: Create key.properties
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > key.properties <<EOF
          storeFile=$RUNNER_TEMP/android-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Read version and check it matches the tag
        id: version
        run: |
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag=$TAG"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
              exit 1
            fi
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify the APK is signed
        if: steps.signing.outputs.available == 'true'
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Collect APK
        id: apk
        run: |
          ls -la app/build/outputs/apk/release/
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          NAME="novelreader-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PREV_TAG="$(git tag --sort=-creatordate \
            | grep -vE "^(${GITHUB_REF_NAME}|release|latest)$" \
            | sed -n '1p' || true)"
          if [ -z "$PREV_TAG" ]; then
            git log --oneline --no-merges > /tmp/release-notes.md
          else
            echo "Comparing against $PREV_TAG"
            git log "${PREV_TAG}..HEAD" --oneline --no-merges > /tmp/release-notes.md
          fi
          echo "--- Preview ---"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: novelreader-${{ steps.version.outputs.name }}
          body_path: /tmp/release-notes.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release build"
            echo ""
            echo "- versionName: \`${{ steps.version.outputs.name }}\`"
            echo "- tag: \`${{ github.ref_name }}\`"
            echo "- signing secrets: \`${{ steps.signing.outputs.available }}\`"
            if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
              echo "- APK: \`${{ steps.apk.outputs.path }}\` (signed)"
            else
              echo "- APK: unsigned, built as a smoke test only"
              echo "- No release was created. Add the four signing secrets to publish from CI, or keep publishing the locally built APK."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
